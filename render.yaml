services:
  - type: web
    name: agent-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to: https://agent-backend-t11g.onrender.com
      - key: VITE_WS_BASE_URL
        sync: false   # Set to: wss://agent-backend-t11g.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
